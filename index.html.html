<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08130d"><title>Roberto's Pumping Crew</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--bg:#07120d;--panel:#07120deF;--border:#315342;--text:#fff;--muted:#b7c4bd;--green:#16c45b;--pink:#ff00d9;--blue:#00a8ff;--yellow:#ffe000;--orange:#ff8a00}*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}#map{background:#111}.leaflet-control-attribution{font-size:9px}.top{position:absolute;z-index:1000;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:7px;align-items:center;pointer-events:none}.brand,.unit,.loc{pointer-events:auto;background:var(--panel);color:#fff;border:1px solid var(--border);border-radius:13px;min-height:46px;display:flex;align-items:center}.brand{padding:8px 12px;font-weight:850;line-height:1.05;flex:1;max-width:260px}.brand b{color:#55d96b;margin-right:8px;font-size:23px}.unit{margin-left:auto;overflow:hidden}.unit button{border-radius:0;border:0;border-right:1px solid #315342;background:transparent;color:#fff;min-width:46px}.unit button.on{background:#008ef0}.loc{border:0;padding:0 13px;font-size:20px}.toolbar{position:absolute;z-index:1000;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--border);border-radius:15px;overflow-x:auto;-webkit-overflow-scrolling:touch}.tool{flex:0 0 72px;min-height:62px;border:0;border-radius:10px;background:transparent;color:#fff;font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.tool .ico{font-size:24px}.tool.on{background:#143b29;outline:2px solid #2acb69}.tool.bound .ico{color:var(--pink)}.tool.set .ico{color:var(--blue)}.tool.hose .ico{color:var(--yellow)}.tool.boost .ico{color:var(--orange)}.hud{position:absolute;z-index:1000;left:8px;top:68px;background:var(--panel);color:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 10px;max-width:min(360px,calc(100% - 16px));font-size:13px;pointer-events:none}.hud strong{font-size:15px}.hud .muted{color:var(--muted);font-size:11px;margin-top:2px}.measure-label{background:#07120de8!important;color:#fff!important;border:1px solid #fff7!important;border-radius:7px!important;box-shadow:none!important;font-weight:800;padding:2px 5px!important}.measure-label:before{display:none}.point{border-radius:50%;background:#fff;border:3px solid currentColor}.toast{position:absolute;z-index:1100;left:50%;transform:translateX(-50%);bottom:92px;background:#07120df2;color:#fff;padding:8px 12px;border-radius:10px;border:1px solid #315342;display:none;font-size:13px;max-width:90%;text-align:center}.savebar{position:absolute;z-index:1000;right:8px;top:68px;display:flex;gap:5px}.savebar button{border:1px solid var(--border);background:var(--panel);color:#fff;border-radius:10px;padding:8px 10px;font-weight:700}button{touch-action:manipulation}.leaflet-container{touch-action:pan-x pan-y}@media(max-width:600px){.brand{max-width:175px;font-size:13px}.brand b{font-size:18px}.unit button{min-width:39px}.savebar{top:122px}.hud{top:68px;max-width:240px}.toolbar{padding-bottom:max(6px,env(safe-area-inset-bottom))}}
</style></head><body><div id="map"></div><div class="top"><div class="brand"><b>🚜</b>Roberto's Pumping Crew</div><div class="unit"><button data-unit="ft" class="on">ft</button><button data-unit="m">m</button><button data-unit="mi">mi</button></div><button id="loc" class="loc" title="My Location">➤</button></div><div id="hud" class="hud"><strong>Ready</strong><div>Choose a drawing tool below.</div><div class="muted">Every line is measured while you draw.</div></div><div class="savebar"><button id="save">Save</button><button id="load">Load</button></div><div class="toolbar"><button class="tool bound" data-mode="boundary"><span class="ico">⬡</span>Boundary</button><button class="tool set" data-mode="set"><span class="ico">▦</span>Set Line</button><button class="tool hose" data-mode="hose"><span class="ico">╱</span>Drag Hose</button><button class="tool boost" data-mode="booster"><span class="ico">◯</span>Booster</button><button class="tool" data-mode="measure"><span class="ico">📏</span>Measure</button><button id="finish" class="tool"><span class="ico">✓</span>Finish</button><button id="undo" class="tool"><span class="ico">↶</span>Undo</button><button id="clear" class="tool"><span class="ico">🗑</span>Clear</button></div><div id="toast" class="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false}).setView([42.84,-88.95],16);L.control.zoom({position:'bottomright'}).addTo(map);
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles © Esri'}).addTo(map);
const streets=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});L.control.layers({'Satellite':satellite,'Map':streets},null,{position:'bottomright'}).addTo(map);
const COLORS={boundary:'#ff00d9',set:'#00a8ff',hose:'#ffe000',measure:'#ffffff'};let unit='ft',mode=null,current=null,history=[],items=[],boosters=[],preview=null,lastMove=null;const hud=document.getElementById('hud'),toast=document.getElementById('toast');
function say(title,body,muted='Tap points on the map.'){hud.innerHTML=`<strong>${title}</strong><div>${body}</div><div class="muted">${muted}</div>`}
function flash(t){toast.textContent=t;toast.style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>toast.style.display='none',1800)}
function fmt(m){if(unit==='m')return `${m<1000?Math.round(m):m.toFixed(1)} m`;if(unit==='mi')return `${(m/1609.344).toFixed(3)} mi`;return `${Math.round(m*3.28084).toLocaleString()} ft`}
function pathMeters(ll){let d=0;for(let i=1;i<ll.length;i++)d+=ll[i-1].distanceTo(ll[i]);return d}
function areaMeters(ll){if(ll.length<3)return 0;return Math.abs(L.GeometryUtil?L.GeometryUtil.geodesicArea(ll):geoArea(ll))}function geoArea(p){const R=6378137;let a=0;if(p.length>2)for(let i=0;i<p.length;i++){let p1=p[i],p2=p[(i+1)%p.length];a+=(p2.lng-p1.lng)*Math.PI/180*(2+Math.sin(p1.lat*Math.PI/180)+Math.sin(p2.lat*Math.PI/180))}return Math.abs(a*R*R/2)}
function labelFor(m){return L.tooltip({permanent:true,direction:'center',className:'measure-label',opacity:1}).setContent(fmt(m))}
function addVertex(ll,color){return L.circleMarker(ll,{radius:5,color,weight:3,fillColor:'#fff',fillOpacity:1}).addTo(map)}
function setMode(m){finish();mode=m;document.querySelectorAll('.tool[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));const names={boundary:['Drawing Field Boundary','Tap each corner. Live segment and perimeter measurements update as you draw.'],set:['Drawing Set Line','Tap points to draw straight set divisions.'],hose:['Drawing Drag Hose','Tap points to draw the hose route. Distance updates live.'],booster:['Placing Booster','Tap anywhere to place a booster.'],measure:['Measuring','Tap points to measure any distance.']};say(...names[m]);map.getContainer().style.cursor='crosshair'}
document.querySelectorAll('.tool[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));document.querySelectorAll('[data-unit]').forEach(b=>b.addEventListener('click',()=>{unit=b.dataset.unit;document.querySelectorAll('[data-unit]').forEach(x=>x.classList.toggle('on',x===b));refreshLabels();if(current)updateCurrent(lastMove)}));
function startLine(ll){const color=COLORS[mode],line=L.polyline([ll],{color,weight:mode==='hose'?6:mode==='boundary'?5:4,dashArray:mode==='measure'?'10,8':null}).addTo(map);current={type:mode,latlngs:[ll],line,vertices:[addVertex(ll,color)],labels:[]};}
function addPoint(ll){if(mode==='booster'){const n=boosters.length+1;const mk=L.circleMarker(ll,{radius:10,color:'#111',weight:3,fillColor:COLORS.hose,fillOpacity:1}).addTo(map).bindTooltip(`Booster ${n}`,{permanent:true,direction:'right',className:'measure-label'});boosters.push({lat:ll.lat,lng:ll.lng,marker:mk});history.push({kind:'booster',marker:mk});flash(`Booster ${n} placed`);return}if(!current)startLine(ll);else{current.latlngs.push(ll);current.line.setLatLngs(current.latlngs);current.vertices.push(addVertex(ll,COLORS[current.type]));addSegmentLabel(current.latlngs.length-2,current.latlngs.length-1);updateCurrent();}}
function addSegmentLabel(i,j){const a=current.latlngs[i],b=current.latlngs[j],m=a.distanceTo(b),mid=L.latLng((a.lat+b.lat)/2,(a.lng+b.lng)/2),t=labelFor(m).setLatLng(mid).addTo(map);current.labels.push({tooltip:t,i,j});}
function updateCurrent(mouse){if(!current)return;const pts=current.latlngs,base=pathMeters(pts),extra=mouse&&pts.length?pts[pts.length-1].distanceTo(mouse):0;let body=`Total: <b>${fmt(base+extra)}</b>`;if(mouse&&pts.length)body+=` · Current segment: <b>${fmt(extra)}</b>`;if(current.type==='boundary'&&pts.length>=3){const ar=geoArea(pts);body+=` · Area: <b>${(ar/4046.8564224).toFixed(2)} acres</b>`}say(current.type==='boundary'?'Drawing Field Boundary':current.type==='hose'?'Drawing Drag Hose':current.type==='set'?'Drawing Set Line':'Measuring',body,'Tap to add point · Finish when done')}
map.on('click',e=>{if(!mode)return;addPoint(e.latlng)});map.on('mousemove',e=>{lastMove=e.latlng;if(current){if(preview)map.removeLayer(preview);const a=current.latlngs[current.latlngs.length-1];preview=L.polyline([a,e.latlng],{color:COLORS[current.type],weight:3,dashArray:'7,7',opacity:.75}).addTo(map);updateCurrent(e.latlng)}});
function finish(){if(preview){map.removeLayer(preview);preview=null}if(!current)return;const c=current;if(c.type==='boundary'&&c.latlngs.length>=3){c.line.setLatLngs([...c.latlngs,c.latlngs[0]]);const a=c.latlngs[c.latlngs.length-1],b=c.latlngs[0],m=a.distanceTo(b),mid=L.latLng((a.lat+b.lat)/2,(a.lng+b.lng)/2);c.labels.push({tooltip:labelFor(m).setLatLng(mid).addTo(map),i:c.latlngs.length-1,j:0});const ar=geoArea(c.latlngs);c.area=ar;flash(`Field: ${(ar/4046.8564224).toFixed(2)} acres · ${fmt(pathMeters([...c.latlngs,c.latlngs[0]]))} perimeter`)}items.push(c);history.push({kind:'item',item:c});current=null;lastMove=null;say('Ready','Choose another tool or continue drawing.','Distances can display in feet, meters, or miles.')}
document.getElementById('finish').onclick=finish;
function removeItem(c){map.removeLayer(c.line);c.vertices.forEach(v=>map.removeLayer(v));c.labels.forEach(x=>map.removeLayer(x.tooltip));items=items.filter(x=>x!==c)}document.getElementById('undo').onclick=()=>{if(current&&current.latlngs.length>1){current.latlngs.pop();map.removeLayer(current.vertices.pop());if(current.labels.length)map.removeLayer(current.labels.pop().tooltip);current.line.setLatLngs(current.latlngs);updateCurrent();return}const h=history.pop();if(!h)return;if(h.kind==='item')removeItem(h.item);else{map.removeLayer(h.marker);boosters.pop()}flash('Undone')};
document.getElementById('clear').onclick=()=>{if(!confirm('Clear all drawings?'))return;finish();items.slice().forEach(removeItem);boosters.forEach(b=>map.removeLayer(b.marker));boosters=[];history=[];say('Ready','All drawings cleared.')};
function refreshLabels(){items.forEach(c=>c.labels.forEach(x=>{const a=c.latlngs[x.i],b=c.latlngs[x.j];x.tooltip.setContent(fmt(a.distanceTo(b)))}));}
document.getElementById('loc').onclick=()=>map.locate({setView:true,maxZoom:18,enableHighAccuracy:true});map.on('locationfound',e=>{L.circleMarker(e.latlng,{radius:7,color:'#fff',weight:3,fillColor:'#16c45b',fillOpacity:1}).addTo(map);flash('Location found')});map.on('locationerror',()=>flash('Location unavailable — check Safari permission'));
function serialize(){return {unit,center:map.getCenter(),zoom:map.getZoom(),items:items.map(c=>({type:c.type,latlngs:c.latlngs.map(p=>[p.lat,p.lng])})),boosters:boosters.map(b=>[b.lat,b.lng])}}
document.getElementById('save').onclick=()=>{localStorage.setItem('robertoDragPlan',JSON.stringify(serialize()));flash('Field saved on this device')};document.getElementById('load').onclick=()=>{const raw=localStorage.getItem('robertoDragPlan');if(!raw){flash('No saved field yet');return}clearAllNoConfirm();const d=JSON.parse(raw);unit=d.unit||'ft';document.querySelectorAll('[data-unit]').forEach(x=>x.classList.toggle('on',x.dataset.unit===unit));d.items.forEach(o=>restoreItem(o));d.boosters.forEach(p=>{mode='booster';addPoint(L.latLng(p[0],p[1]))});mode=null;map.setView(d.center,d.zoom);say('Loaded','Saved field restored.');};
function clearAllNoConfirm(){finish();items.slice().forEach(removeItem);boosters.forEach(b=>map.removeLayer(b.marker));boosters=[];history=[]}
function restoreItem(o){mode=o.type;const ll=o.latlngs.map(p=>L.latLng(p[0],p[1]));startLine(ll[0]);for(let i=1;i<ll.length;i++){current.latlngs.push(ll[i]);current.line.setLatLngs(current.latlngs);current.vertices.push(addVertex(ll[i],COLORS[o.type]));addSegmentLabel(i-1,i)}finish()}
</script></body></html>
